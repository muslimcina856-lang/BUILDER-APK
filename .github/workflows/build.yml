name: Build Engine (Official API)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Source filename'
        required: true
        default: 'source.zip'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true
      user_display:
        description: 'User display name'
        required: true
      in_progress:
        description: 'Build in progress count'
        required: true
      channel_id:
        description: 'Telegram Channel ID'
        required: false
      api_id:
        description: 'Telethon API ID'
        required: true
      api_hash:
        description: 'Telethon API Hash'
        required: true
      source_mode:
        description: 'Project source mode: repo or telegram'
        required: false
        default: 'repo'
      telegram_document_id:
        description: 'Telegram document ID for direct runner download'
        required: false
        default: ''
      telegram_access_hash:
        description: 'Telegram document access hash'
        required: false
        default: ''
      telegram_file_reference:
        description: 'Base64 Telegram file reference'
        required: false
        default: ''
      telegram_dc_id:
        description: 'Telegram document DC ID'
        required: false
        default: ''
      telegram_file_size:
        description: 'Telegram document size in bytes'
        required: false
        default: ''
      godot_preset:
        description: 'Godot Android preset name (optional; runnable/first preset if empty)'
        required: false
        default: ''
      godot_export_mode:
        description: 'Godot export mode: auto, debug, release, both'
        required: false
        default: 'auto'
      godot_build_all_presets:
        description: 'Build every Android preset for Godot'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          bash scripts/setup_android_sdk.sh
          bash scripts/setup_apktool.sh
          pip install -r server/requirements.txt
          pip install telethon

      - name: Setup Godot Host Dependencies
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Regression Tests
        env:
          PYTHONPATH: server
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Build Worker
        env:
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          CHANNEL_ID: ${{ github.event.inputs.channel_id }}
          USER_DISPLAY: ${{ github.event.inputs.user_display }}
          IN_PROGRESS: ${{ github.event.inputs.in_progress }}
          TARGET_FILE: ${{ github.event.inputs.target }}
          API_ID: ${{ github.event.inputs.api_id }}
          API_HASH: ${{ github.event.inputs.api_hash }}
          SOURCE_MODE: ${{ github.event.inputs.source_mode }}
          TELEGRAM_DOCUMENT_ID: ${{ github.event.inputs.telegram_document_id }}
          TELEGRAM_ACCESS_HASH: ${{ github.event.inputs.telegram_access_hash }}
          TELEGRAM_FILE_REFERENCE: ${{ github.event.inputs.telegram_file_reference }}
          TELEGRAM_DC_ID: ${{ github.event.inputs.telegram_dc_id }}
          TELEGRAM_FILE_SIZE: ${{ github.event.inputs.telegram_file_size }}
          GITHUB_TOKEN: ${{ github.token }}
          GODOT_PRESET: ${{ github.event.inputs.godot_preset }}
          GODOT_EXPORT_MODE: ${{ github.event.inputs.godot_export_mode }}
          GODOT_BUILD_ALL_PRESETS: ${{ github.event.inputs.godot_build_all_presets }}
        run: |
          python3 server/worker.py
